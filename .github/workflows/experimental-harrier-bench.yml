name: Temporary Arabic-English embedding benchmark

on:
  push:
    branches: [experiment/harrier-bilingual-bench-20261107]
    paths:
      - experimental/harrier_bilingual_benchmark.py
      - .github/workflows/experimental-harrier-bench.yml

permissions:
  contents: read

jobs:
  bilingual-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install CPU inference tools
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu torch
          pip install "sentence-transformers>=5.0,<6" "numpy>=1.26,<3"
      - name: Run no-secret cross-language retrieval comparison
        env:
          OMP_NUM_THREADS: "2"
          MKL_NUM_THREADS: "2"
          TOKENIZERS_PARALLELISM: "false"
          HF_HUB_DISABLE_TELEMETRY: "1"
        run: |
          python -u experimental/harrier_bilingual_benchmark.py
